name: uniqueue_mobile
description: UniQueue Live - School Queue Tracker Mobile App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_database: ^10.4.9
  firebase_messaging: ^14.9.4

  # UI
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

  mobile_scanner: ^5.2.3

dependency_overrides:
  vector_math: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_local_notifications: ^18.0.1
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/